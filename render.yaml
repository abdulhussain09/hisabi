services:
  - type: web
    name: hisabi-1
    runtime: docker
    region: singapore # Or your preferred region
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User will provide Neon URL
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # User will provide Vercel URL
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium

